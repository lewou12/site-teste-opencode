<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World — Deploy Autônomo</title>
  <meta name="description" content="Hello World com deploy autônomo bem-sucedido no Cloudflare Pages." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0b0f;
      --surface: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.09);
      --text: #f5f5f7;
      --muted: #9a9aa5;
      --accent: #7c5cff;
      --accent-2: #22d3ee;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 2rem;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient glow */
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 60vmax;
      height: 60vmax;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.22;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      background: var(--accent);
      top: -25vmax;
      left: -20vmax;
    }
    body::after {
      background: var(--accent-2);
      bottom: -30vmax;
      right: -20vmax;
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(680px, 100%);
      padding: clamp(2.5rem, 6vw, 4rem);
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.9rem;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      margin-bottom: 1.75rem;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 12px #34d399;
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    h1 {
      font-size: clamp(2.75rem, 9vw, 4.75rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ffffff 20%, #b9b3ff 55%, #7ee7f5 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1.25rem;
    }

    p {
      font-size: clamp(1rem, 2.4vw, 1.15rem);
      font-weight: 300;
      line-height: 1.7;
      color: var(--muted);
      max-width: 46ch;
      margin: 0 auto 2.25rem;
    }

    p strong {
      color: var(--text);
      font-weight: 500;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 0 auto 2.25rem;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .meta span {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
    }

    .meta svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.8;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">
      <span class="dot" aria-hidden="true"></span>
      Deploy concluído
    </div>

    <h1>Hello, World.</h1>

    <p>
      O deploy autônomo foi um <strong>sucesso</strong>. Este site foi gerado,
      versionado e publicado automaticamente, sem intervenção manual.
    </p>

    <div class="divider" aria-hidden="true"></div>

    <div class="meta">
      <span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
        Build OK
      </span>
      <span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></svg>
        Git versionado
      </span>
      <span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/></svg>
        Cloudflare Pages
      </span>
    </div>
  </main>
</body>
</html>
